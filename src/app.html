<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
		<title>Kalkulator Biaya Pengiriman Ekspor Shopee FLEXI</title>
		<meta name="description" content="Aplikasi independen perhitungan tarif resmi ongkir ekspor Shopee FLEXI untuk penjual Indonesia ke Brunei, Filipina, Malaysia, Singapura, dan Thailand." />
		<script>
			// Avoid flash of unstyled theme on load
			(function() {
				const theme = localStorage.getItem('shopee_flexi_theme') || 'system';
				if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-slate-50 text-slate-900 dark:bg-[#0B1120] dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
